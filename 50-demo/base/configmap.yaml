apiVersion: v1
kind: ConfigMap
metadata:
  name: log-demo-app
data:
  app.py: |
    """Noisy little workload for demonstrating log forwarding.

    Emits one JSON line per heartbeat on a timer, and one per HTTP request, so
    you can either watch records arrive on their own or make one appear on
    demand by hitting the route. Every line carries the namespace, which is
    what the ClusterLogForwarder routes on.
    """
    import http.server
    import json
    import os
    import threading
    import time

    NAMESPACE = os.environ.get("NAMESPACE", "unknown")
    POD = os.environ.get("POD_NAME", "unknown")
    INTERVAL = int(os.environ.get("HEARTBEAT_SECONDS", "10"))
    PORT = int(os.environ.get("PORT", "8080"))

    hits = 0


    def log(event, **fields):
        record = {
            "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
            "namespace": NAMESPACE,
            "pod": POD,
            "event": event,
        }
        record.update(fields)
        # flush: without it Python buffers stdout when it is a pipe rather than
        # a terminal, and records would reach Kafka in delayed clumps.
        print(json.dumps(record), flush=True)


    def heartbeat():
        seq = 0
        while True:
            seq += 1
            log("heartbeat", seq=seq, message=f"heartbeat {seq} from {NAMESPACE}")
            time.sleep(INTERVAL)


    class Handler(http.server.BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            global hits
            if self.path == "/healthz":
                self._respond(200, "ok\n")
                return
            hits += 1
            log(
                "request",
                hit=hits,
                path=self.path,
                client=self.client_address[0],
                message=f"handled request {hits} in {NAMESPACE}",
            )
            self._respond(
                200,
                f"hello from {NAMESPACE} ({POD})\n"
                f"this request was logged as hit {hits}\n",
            )

        def _respond(self, code, body):
            payload = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, *args):
            # Silence the default stderr access log; we emit our own JSON.
            pass


    if __name__ == "__main__":
        log("startup", message=f"log-demo starting in {NAMESPACE}", interval=INTERVAL)
        threading.Thread(target=heartbeat, daemon=True).start()
        http.server.ThreadingHTTPServer(("", PORT), Handler).serve_forever()
