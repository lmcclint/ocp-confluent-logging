apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-demo
  labels:
    app: log-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-demo
  template:
    metadata:
      labels:
        app: log-demo
    spec:
      containers:
        - name: app
          # UBI rather than Docker Hub: no anonymous pull rate limit, and it
          # runs happily under OpenShift's restricted-v2 SCC as a random UID.
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/opt/demo/app.py"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEARTBEAT_SECONDS
              value: "10"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          volumeMounts:
            - name: app
              mountPath: /opt/demo
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: app
          configMap:
            name: log-demo-app
