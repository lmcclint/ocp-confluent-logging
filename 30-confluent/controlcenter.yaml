apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 10Gi
  image:
    application: confluentinc/cp-enterprise-control-center:7.9.9
    init: confluentinc/confluent-init-container:3.3.0
  tls:
    autoGeneratedCerts: true
  # CFK creates the Route and, because TLS is on, sets it to passthrough.
  # The certificate is signed by our private CA, so browsers will warn.
  #
  # `domain` is the one genuinely cluster-specific value in this repo, and CFK
  # requires it. The placeholder below is replaced at deploy time by
  # bootstrap.sh, which reads the real one from the cluster:
  #
  #   oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
  #
  # Set it here permanently if you would rather pin it per environment.
  externalAccess:
    type: route
    route:
      domain: apps.example.com
      prefix: controlcenter
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      tls:
        enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      tls:
        enabled: true
  configOverrides:
    server:
      - confluent.controlcenter.command.topic.replication=1
      - confluent.controlcenter.replication.factor=1
      - confluent.controlcenter.internal.topics.replication=1
      - confluent.metrics.topic.replication=1
      - confluent.monitoring.interceptor.topic.replication=1
      # C3 defaults to a stream thread per core and runs several Kafka Streams
      # topologies (1-minute and 3-hour monitoring windows, command, group
      # rekey). On a lab cluster that is far more parallelism than the data
      # justifies, and each thread carries its own RocksDB state.
      - confluent.controlcenter.streams.num.stream.threads=2
    jvm:
      # Set the heap explicitly. CFK otherwise derives -Xmx from the memory
      # request and gave the JVM the ENTIRE 2Gi request as heap, leaving zero
      # headroom for RocksDB (off-heap), direct buffers and metaspace - so the
      # container's RSS ran to 3.8Gi against a 2Gi request while the heap
      # itself stayed full and GC-thrashed. That is what makes the UI load
      # blank or barely at all: the backend is too busy collecting garbage to
      # answer the SPA.
      #
      # 4G heap inside an 8Gi limit leaves real room for the off-heap side.
      - "-Xmx4G"
      - "-Xms1G"
  podTemplate:
    podSecurityContext: {}
    probe:
      liveness:
        periodSeconds: 10
        failureThreshold: 5
        timeoutSeconds: 500
    resources:
      requests:
        cpu: "1"
        memory: 6Gi
      limits:
        cpu: "2"
        memory: 8Gi
