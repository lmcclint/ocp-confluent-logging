apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:7.9.9
    init: confluentinc/confluent-init-container:3.3.0
  tls:
    autoGeneratedCerts: true
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      tls:
        enabled: true
  configOverrides:
    server:
      - kafkastore.topic.replication.factor=1
  podTemplate:
    podSecurityContext: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
