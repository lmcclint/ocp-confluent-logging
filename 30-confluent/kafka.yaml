apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 20Gi
  image:
    application: confluentinc/cp-server:7.9.9
    init: confluentinc/confluent-init-container:3.3.0
  tls:
    autoGeneratedCerts: true
  listeners:
    # Port 9071. TLS for encryption and server identity, but no `authentication`
    # block: the log collector authenticates with nothing and simply verifies
    # the broker certificate against our CA. Add SASL here once the pipeline is
    # proven.
    internal:
      tls:
        enabled: true
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      # Must mirror the KRaftController's `listeners.controller.tls.enabled`.
      # CFK does not infer it from the referenced cluster, and without it the
      # broker dials the SSL controller listener in plaintext and never
      # registers:
      #   SSL handshake failed caused by Unrecognized SSL message, plaintext connection?
      controllerListener:
        tls:
          enabled: true
  configOverrides:
    server:
      # Every internal topic defaults to RF 3; with a single broker each of
      # these would block cluster startup.
      - confluent.license.topic.replication.factor=1
      - confluent.metrics.reporter.topic.replicas=1
      - confluent.tier.metadata.replication.factor=1
      - confluent.metadata.topic.replication.factor=1
      - confluent.balancer.topic.replication.factor=1
      - confluent.security.event.logger.exporter.kafka.topic.replicas=1
      - event.logger.exporter.kafka.topic.replicas=1
      - offsets.topic.replication.factor=1
      - transaction.state.log.replication.factor=1
      - transaction.state.log.min.isr=1
      # Backstop for the log firehose. Kafka's default log.retention.bytes is
      # -1 (unbounded), so a topic created without a size cap - auto-created,
      # or added by hand later - is free to fill the volume and take the broker
      # down with it. 1Gi per partition, cluster-wide default.
      #
      # Deliberately NOT setting log.segment.bytes here: Control Center health
      # checks expect the stock 1Gi on its own internal topics and log
      # "misconfigured topic=_confluent-command" against a smaller value. The
      # smaller segment size only matters for the high-volume log topic, so it
      # lives in topic.yaml instead.
      - log.retention.bytes=1073741824
      # Check for expired segments every minute rather than every five, so
      # retention reacts before a burst can outrun it.
      - log.retention.check.interval.ms=60000

      # The forwarder routes to a topic per namespace, so topic names are not
      # known ahead of time and cannot be pre-created as KafkaTopic CRs. CFK
      # ships auto.create.topics.enable=false, which would make the collector
      # fail to produce for every namespace it discovers.
      #
      # This is exactly why log.retention.bytes above matters: auto-created
      # topics get no per-topic cap, so the cluster-wide default is the only
      # thing standing between a busy namespace and a full disk.
      - auto.create.topics.enable=true
      # Auto-creation uses these defaults. The stock replication factor is 3,
      # which cannot be satisfied by a single broker - creation would fail.
      - default.replication.factor=1
      # One partition per namespace topic. Expect many small topics here, not
      # a few large ones.
      - num.partitions=1
  metricReporter:
    enabled: true
    # The metric reporter is a Kafka client pointed at this same cluster, so it
    # inherits the internal listener's TLS. CFK rejects the CR without this once
    # `listeners.internal.tls.enabled` is true.
    tls:
      enabled: true
    replicationFactor: 1
  podTemplate:
    podSecurityContext: {}
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
