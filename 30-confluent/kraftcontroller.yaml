apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 10Gi
  # CFK requires spec.image; there is no operator-side default. The init
  # container tracks the CFK version (3.3.0), not the CP version.
  image:
    application: confluentinc/cp-server:7.9.9
    init: confluentinc/confluent-init-container:3.3.0
  tls:
    autoGeneratedCerts: true
  listeners:
    controller:
      tls:
        enabled: true
  podTemplate:
    # Empty context => OpenShift's restricted-v2 SCC assigns a UID from the
    # namespace range. CFK's default (runAsUser 1001) is rejected by that SCC.
    podSecurityContext: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
