apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: confluent
# The forwarder routes to a topic per namespace, so topic names are not known
# in advance and the broker creates them on demand (auto.create.topics.enable
# in kafka.yaml). topic-overrides.yaml then pins settings for individual ones.
resources:
  - kraftcontroller.yaml
  - kafka.yaml
  - schemaregistry.yaml
  - controlcenter.yaml
  - controlcenter-route.yaml
  - topic-overrides.yaml
